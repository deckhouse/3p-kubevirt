# .gitlab-ci.yml
#
# Ported from .github/workflows/test.yml

stages:
  - test

default:
  tags:
    - deckhouse

variables:
  GO_VERSION: "1.25.10"
  GINKGO_VERSION: "v2.22.1"
  KUBEVIRT_VERSION: "1.6.2"
  # The runner uses a shell executor, so the host Go may be older than the
  # version go.work requires. Let the go command download the matching
  # toolchain instead of failing on a pinned GOTOOLCHAIN.
  GOTOOLCHAIN: "go${GO_VERSION}"

# Run kubevirt tests
kvtest:
  stage: test
  image: golang:${GO_VERSION}
  script:
    # Prepare environment
    - go mod edit -go=${GO_VERSION}
    - go mod download
    - go work vendor
    - go install github.com/onsi/ginkgo/v2/ginkgo@${GINKGO_VERSION}
    # go install drops the binary in $GOPATH/bin, which the shell runner does
    # not put on PATH (GitHub's setup-go does this automatically).
    - export PATH="$(go env GOPATH)/bin:$PATH"
    # Run unit test virt-controller
    - ginkgo -succinct pkg/virt-controller/...
  rules:
    # merge request targeting a *virtualization* or dvp/* branch
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /virtualization/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^dvp\//'
    # push to a *virtualization* or dvp/* branch
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /virtualization/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^dvp\//'
    # manual trigger (workflow_dispatch equivalent)
    - if: '$CI_PIPELINE_SOURCE == "web"'
